# The iPhone app's Xcode project, generated by XcodeGen: run `xcodegen` in this folder after
# adding or removing files. OctoShow.xcodeproj is made from this and is not kept in git.
# Who signs it, and as what bundle identifier, is in Signing.xcconfig.
name: OctoShow
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  PartKit:
    path: Packages/PartKit
targets:
  OctoShow:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: OctoShow
      # The same font the Echo Show display is set in, shared rather than copied.
      - path: ../android/app/src/main/res/font/archivo.ttf
        buildPhase: resources
    dependencies:
      - package: PartKit
    scheme:
      testTargets:
        - OctoShowTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(OCTOSHOW_BUNDLE_ID).ios
        PRODUCT_NAME: OctoShow
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: OctoShow/Info.plist
        ENABLE_PREVIEWS: YES
    info:
      path: OctoShow/Info.plist
      properties:
        CFBundleDisplayName: OctoShow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - archivo.ttf
        # Finding OctoPrint on the home network, the way the Echo Show does.
        NSLocalNetworkUsageDescription: OctoShow looks for OctoPrint on your network and talks to it there.
        NSBonjourServices:
          - _octoprint._tcp
          - _http._tcp
        # OctoPrint is plain http or https with the Pi's own certificate, at home and over a
        # VPN such as Tailscale; the app checks that certificate itself (see ServerTrust.swift).
        # (NSAllowsLocalNetworking is left out on purpose: its presence makes iOS ignore this.)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # octoshow:// opens the app from an alert (see Alerts in Settings).
        CFBundleURLTypes:
          - CFBundleURLName: com.drazan.octoshow.ios
            CFBundleURLSchemes:
              - octoshow
  OctoShowTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: OctoShowTests
    dependencies:
      - target: OctoShow
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(OCTOSHOW_BUNDLE_ID).ios.tests
